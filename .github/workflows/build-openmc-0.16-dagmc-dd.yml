name: Build OpenMC 0.16.0 with Double Down

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/build-openmc-0.16-dagmc-dd.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out official OpenMC build files
        uses: actions/checkout@v4
        with:
          repository: openmc-dev/openmc
          ref: develop
          path: openmc-source

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish OpenMC
        uses: docker/build-push-action@v6
        with:
          context: ./openmc-source
          target: build
          platforms: linux/amd64
          push: true
          tags: ghcr.io/emilinly/openmc:0.16.0-dagmc-dd
          build-args: |
            openmc_branch=v0.16.0
            build_dagmc=on
            build_libmesh=off
            compile_cores=4
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
